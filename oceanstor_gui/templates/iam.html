<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM Policy Management - Huawei OceanStor S3</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: #0056b3; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], textarea { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { min-height: 100px; font-family: monospace; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #policy_list { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background-color: #e9ecef; }
        #policy_list h2 { margin-top: 0; }
        .policy-item { margin-bottom: 15px; padding: 10px; background-color: #f8f9fa; border: 1px solid #ced4da; border-radius: 4px; }
        .policy-item h3 { margin-top: 0; margin-bottom: 5px; color: #0056b3; }
        #policy_message { margin-top: 15px; padding: 10px; border-radius: 4px; }
        .error { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .success { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
        pre { white-space: pre-wrap; word-wrap: break-word; background-color: #e9ecef; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; }
        nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Bucket Management</a>
            <a href="/iam">IAM Policy Management</a>
        </nav>
    </div>

    <div class="container">
        <h1>IAM Policy Management</h1>
        
        <div id="policy_message"></div>

        <h2>Create New IAM Policy</h2>
        <form id="createPolicyForm">
            <div>
                <label for="policy_name">Policy Name:</label>
                <input type="text" id="policy_name" name="policy_name" required>
            </div>
            <div>
                <label for="policy_document">Policy Document (JSON):</label>
                <textarea id="policy_document" name="policy_document" required></textarea>
            </div>
            <button type="submit">Create Policy</button>
        </form>
    </div>

    <div class="container" id="policy_list_container">
        <h2>Existing IAM Policies</h2>
        <div id="policy_list">
            <p>Loading policies...</p>
        </div>
    </div>

    <script>
        const policyListDiv = document.getElementById('policy_list');
        const policyMessageDiv = document.getElementById('policy_message');
        const createPolicyForm = document.getElementById('createPolicyForm');
        const policyNameInput = document.getElementById('policy_name');
        const policyDocumentTextarea = document.getElementById('policy_document');
        const submitButton = createPolicyForm.querySelector('button[type="submit"]');
        let currentEditPolicyName = null; // To track if we are in edit mode

        function resetPolicyForm() {
            createPolicyForm.reset();
            policyNameInput.readOnly = false;
            submitButton.textContent = 'Create Policy';
            currentEditPolicyName = null;
            // Remove cancel button if it exists
            const cancelButton = document.getElementById('cancelEditButton');
            if (cancelButton) {
                cancelButton.remove();
            }
            // Scroll to form
            // createPolicyForm.scrollIntoView({ behavior: 'smooth' });
        }

        function handleEditPolicy(policyName, policyDocument) {
            currentEditPolicyName = policyName;
            policyNameInput.value = policyName;
            policyNameInput.readOnly = true;
            policyDocumentTextarea.value = JSON.stringify(policyDocument, null, 2);
            submitButton.textContent = 'Update Policy';

            // Add a cancel button if it doesn't exist
            if (!document.getElementById('cancelEditButton')) {
                const cancelButton = document.createElement('button');
                cancelButton.textContent = 'Cancel Edit';
                cancelButton.type = 'button'; // Important to prevent form submission
                cancelButton.id = 'cancelEditButton';
                cancelButton.style.marginLeft = '10px';
                cancelButton.style.backgroundColor = '#6c757d'; // A different color for cancel
                cancelButton.addEventListener('click', resetPolicyForm);
                submitButton.parentNode.insertBefore(cancelButton, submitButton.nextSibling);
            }
            // Scroll to form for editing
             createPolicyForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function fetchAndDisplayPolicies() {
            policyListDiv.innerHTML = '<p>Loading policies...</p>';
            try {
                const response = await fetch('/api/iam/policies');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const policies = await response.json();
                
                if (Object.keys(policies).length === 0) {
                    policyListDiv.innerHTML = '<p>No IAM policies found.</p>';
                    return;
                }

                let listHtml = '';
                for (const policyName in policies) {
                    listHtml += `<div class="policy-item">`;
                    listHtml += `<h3>${escapeHtml(policyName)}</h3>`;
                    listHtml += `<pre>${escapeHtml(JSON.stringify(policies[policyName], null, 2))}</pre>`;
                    // Add Edit button
                    listHtml += `<button class="edit-policy-button" data-policy-name="${escapeHtml(policyName)}">Edit</button>`;
                    listHtml += `</div>`;
                }
                policyListDiv.innerHTML = listHtml;

                // Attach event listeners to new edit buttons
                document.querySelectorAll('.edit-policy-button').forEach(button => {
                    button.addEventListener('click', () => {
                        const policyName = button.dataset.policyName;
                        // The policies object is in scope from the fetchAndDisplayPolicies function
                        handleEditPolicy(policyName, policies[policyName]);
                    });
                });

            } catch (error) {
                policyListDiv.innerHTML = `<p class="error">Error loading policies: ${escapeHtml(error.message)}</p>`;
            }
        }

        createPolicyForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            policyMessageDiv.innerHTML = ''; // Clear previous messages
            policyMessageDiv.className = '';

            const policyName = policyNameInput.value.trim(); // Use the global input ref
            const policyDocumentString = policyDocumentTextarea.value.trim(); // Use the global textarea ref

            if (!policyName || !policyDocumentString) {
                displayMessage('Policy name and document cannot be empty.', 'error');
                return;
            }

            let policyDocument;
            try {
                policyDocument = JSON.parse(policyDocumentString);
            } catch (e) {
                displayMessage('Invalid JSON in policy document: ' + e.message, 'error');
                return;
            }

            try {
                let response;
                let url = '/api/iam/policies';
                let method = 'POST';
                let body = { policy_name: policyName, policy_document: policyDocument };

                if (currentEditPolicyName) {
                    // Edit mode
                    if (policyName !== currentEditPolicyName) {
                        // This case should ideally be prevented by readOnly input, but good to double check.
                        displayMessage('Policy name cannot be changed during an update. Please cancel edit to create a new policy.', 'error');
                        return;
                    }
                    url = `/api/iam/policies/${encodeURIComponent(currentEditPolicyName)}`;
                    method = 'PUT';
                    // For PUT, only policy_document is needed in the body as per backend implementation
                    body = { policy_document: policyDocument }; 
                }

                response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body),
                });

                const result = await response.json();

                if (response.ok) {
                    const action = currentEditPolicyName ? 'updated' : 'created';
                    displayMessage(`Policy '${escapeHtml(policyName)}' ${action} successfully: ${escapeHtml(result.message || 'Success!')}`, 'success');
                    resetPolicyForm(); // Reset form to initial state
                    fetchAndDisplayPolicies(); // Refresh the list
                } else {
                    const action = currentEditPolicyName ? 'update' : 'create';
                    displayMessage(`Error during policy ${action}: ${escapeHtml(result.error || `Failed to ${action} policy.`)} (Status: ${response.status})` +
                                   (result.details ? ` Details: ${escapeHtml(result.details)}` : ''), 'error');
                }
            } catch (error) {
                displayMessage(`An unexpected error occurred: ${escapeHtml(error.message)}`, 'error');
            }
        });

        function displayMessage(message, type) {
            policyMessageDiv.innerHTML = `<p>${message}</p>`;
            policyMessageDiv.className = type; // 'success' or 'error'
        }
        
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Initial load of policies
        document.addEventListener('DOMContentLoaded', fetchAndDisplayPolicies);
    </script>
</body>
</html>
